<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 人體筋膜互動評估系統｜嘉豪師傅 HAOBOXING</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    
    * {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      box-sizing: border-box;
    }

    body {
      background-color: #050816;
      color: #f8fafc;
      overflow: hidden;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fef3c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gold-btn {
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
    }

    .gold-btn:hover {
      background: linear-gradient(135deg, #b45309 0%, #d97706 100%);
      box-shadow: 0 6px 25px rgba(245, 158, 11, 0.5);
    }

    /* 3D 浮動標記點樣式 (加大觸控面積確保手機好點) */
    .hotspot-marker {
      position: absolute;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 50;
      pointer-events: auto !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hotspot-ring {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.35);
      animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
    }

    .hotspot-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fbbf24;
      box-shadow: 0 0 12px #fbbf24;
      transition: all 0.2s ease;
    }

    .hotspot-marker:hover .hotspot-dot {
      transform: scale(1.3);
      background: #ef4444;
      box-shadow: 0 0 16px #ef4444;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row relative">

  <!-- 左側控制面板 -->
  <div class="w-full md:w-[420px] lg:w-[460px] h-[45vh] md:h-full z-30 flex flex-col justify-between p-5 md:p-7 glass-panel border-r border-white/10 overflow-y-auto">
    
    <div>
      <!-- 品牌標題 -->
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400">
          <i data-lucide="activity" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base md:text-lg font-bold tracking-wider text-white">HAOBOXING 嘉豪師傅</h1>
          <p class="text-xs text-amber-400/90 font-medium">台南傳統整復推拿・3D 筋膜互動評估</p>
        </div>
      </div>

      <!-- 快速點選部位按鈕 (雙重防呆點選) -->
      <div class="mb-4">
        <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-2">快速選擇緊繃部位 (點擊自動旋轉特寫)：</span>
        <div class="grid grid-cols-3 gap-1.5" id="quick-select-btns">
          <!-- JS 動態生成 -->
        </div>
      </div>

      <!-- 動態調理說明卡片 -->
      <div id="detail-card" class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 mb-4 transition-all">
        <div class="flex justify-between items-start mb-2">
          <div>
            <span id="target-category" class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 uppercase">
              肩頸與上肢
            </span>
            <h3 id="target-title" class="text-base font-bold text-white mt-1">
              肩頸 / 上斜方肌緊繃
            </h3>
          </div>
          <button id="add-to-assessment-btn" class="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black text-xs font-bold flex items-center gap-1 transition-all shadow-md">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>加入評估</span>
          </button>
        </div>

        <div class="space-y-2 text-xs text-gray-300">
          <div>
            <span class="text-gray-400 font-semibold block">成因與壓力：</span>
            <p id="target-cause" class="text-gray-300 leading-relaxed">
              長期低頭滑手機、電腦螢幕過低，導致頸後肌群代償性緊繃，引發肩頸僵硬與緊箍感。
            </p>
          </div>
          <div>
            <span class="text-amber-400 font-semibold block">嘉豪師傅調理重點：</span>
            <p id="target-solution" class="text-amber-100/90 leading-relaxed">
              放鬆胸鎖乳突肌與深層枕下肌群，撥開斜方肌筋結，恢復頸部旋轉活動度。
            </p>
          </div>
        </div>
      </div>

      <!-- 已選痛點清單 -->
      <div class="mb-4">
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-xs font-bold text-gray-400 uppercase">已選項目 (<span id="selected-count">1</span>)</span>
          <button id="clear-selected-btn" class="text-[11px] text-gray-500 hover:text-gray-300">清空</button>
        </div>
        <div id="selected-tags" class="flex flex-wrap gap-1.5 min-h-[30px] p-2 rounded-xl bg-slate-950/50 border border-slate-800">
          <span class="px-2 py-1 rounded-lg bg-amber-500/20 text-amber-300 text-[11px] font-semibold flex items-center gap-1 border border-amber-500/30">
            <span>肩頸 / 上斜方肌緊繃</span>
          </span>
        </div>
      </div>
    </div>

    <!-- 底部行動按鈕 -->
    <div class="pt-3 border-t border-slate-800">
      <a id="line-booking-btn" href="https://line.me/R/ti/p/@339qipqu" target="_blank" class="w-full py-3 rounded-xl gold-btn text-black font-black text-sm flex items-center justify-center gap-2 transition-all">
        <i data-lucide="message-circle" class="w-4 h-4"></i>
        <span>帶著評估直接加 LINE 諮詢嘉豪師傅</span>
      </a>
    </div>

  </div>

  <!-- 右側 3D 畫布 -->
  <div class="flex-1 h-[55vh] md:h-full relative bg-radial from-slate-900 to-[#050816] flex items-center justify-center overflow-hidden">
    
    <!-- 3D WebGL Canvas -->
    <canvas id="body-canvas" class="w-full h-full cursor-grab active:cursor-grabbing"></canvas>

    <!-- 浮動熱點容器 -->
    <div id="hotspots-container" class="absolute inset-0 pointer-events-none z-20"></div>

    <!-- 視角切換浮動按鈕 -->
    <div class="absolute bottom-5 right-5 z-30 flex gap-2">
      <button id="view-front" class="px-3 py-1.5 rounded-lg glass-panel hover:border-amber-400 text-xs font-bold text-gray-200 shadow-lg">正面</button>
      <button id="view-back" class="px-3 py-1.5 rounded-lg glass-panel hover:border-amber-400 text-xs font-bold text-gray-200 shadow-lg">背面</button>
      <button id="view-reset" class="px-3 py-1.5 rounded-lg glass-panel hover:border-amber-400 text-xs font-bold text-gray-200 shadow-lg">重設視角</button>
    </div>

    <!-- 提示 -->
    <div class="absolute top-4 right-4 z-30 glass-panel px-3 py-1.5 rounded-full text-xs text-gray-300 flex items-center gap-1.5 pointer-events-none">
      <i data-lucide="mouse-pointer" class="w-3.5 h-3.5 text-amber-400"></i>
      <span>點擊人體部位或金色圓點即可特寫</span>
    </div>

  </div>

  <!-- 3D 腳本 -->
  <script>
    lucide.createIcons();

    // 熱點資料庫
    const HOTSPOTS_DATA = [
      {
        id: "neck",
        name: "肩頸 / 上斜方肌",
        category: "上肢與頸椎筋膜鏈",
        position: new THREE.Vector3(0, 2.1, 0.25),
        camOffset: new THREE.Vector3(0, 2.1, 2.3),
        cause: "長期低頭滑手機、電腦螢幕過低，導致頸後肌群代償性緊繃，引發肩頸僵硬與緊箍感。",
        solution: "放鬆胸鎖乳突肌與深層枕下肌群，撥開斜方肌筋結，恢復頸部旋轉活動度。"
      },
      {
        id: "rhomboid",
        name: "膏肓 / 菱形肌",
        category: "胸椎與背部深層筋膜",
        position: new THREE.Vector3(0.45, 1.6, -0.35),
        camOffset: new THREE.Vector3(0.8, 1.6, -2.4),
        cause: "圓肩駝背、久坐手臂懸空，肩胛骨長期處於外展位，深層菱形肌被拉扯缺氧產生酸痛點。",
        solution: "不單純壓痛點，先鬆解前方胸小肌拉力，再順著肩胛內側緣深層撥筋調理。"
      },
      {
        id: "lumbar",
        name: "腰背 / 腰方肌",
        category: "核心與骨盆支撐鏈",
        position: new THREE.Vector3(0, 0.7, -0.35),
        camOffset: new THREE.Vector3(0, 0.7, -2.6),
        cause: "骨盆前傾/後傾、久坐腰部懸空，或運動時核心未收緊，腰椎承受異常剪力壓力。",
        solution: "調理腰方肌、豎脊肌及髂腰肌張力平衡，釋放腰椎壓力，舒緩腰部僵直沉重感。"
      },
      {
        id: "gluteal",
        name: "臀部 / 梨狀肌",
        category: "骨盆與下肢旋轉肌群",
        position: new THREE.Vector3(-0.45, 0.05, -0.4),
        camOffset: new THREE.Vector3(-0.8, 0.05, -2.5),
        cause: "翹二郎腿、久坐硬椅子，梨狀肌痙攣壓迫坐骨神經通道，產生臀部深層酸脹感。",
        solution: "深層放鬆臀中肌與梨狀肌，配合髖關節被動伸展，恢復骨盆旋轉自由度。"
      },
      {
        id: "itband",
        name: "大腿 / 髂脛束",
        category: "跑步與下肢側向穩定鏈",
        position: new THREE.Vector3(0.65, -0.9, 0.1),
        camOffset: new THREE.Vector3(1.6, -0.9, 2.3),
        cause: "跑步族、深蹲或拳擊步法移動頻繁，闊筋膜張肌緊繃過度，外側筋膜摩擦膝關節。",
        solution: "釋放大腿外側張力，調理股外側肌與臀大肌交界筋膜，減輕膝關節牽拉感。"
      },
      {
        id: "calf",
        name: "小腿 / 比目魚肌",
        category: "足底與小腿推進鏈",
        position: new THREE.Vector3(-0.45, -2.1, -0.2),
        camOffset: new THREE.Vector3(-0.8, -2.1, -2.4),
        cause: "久站、運動後缺乏拉伸、常穿高跟鞋，小腿肌肉彈性下降，足底與阿基里斯腱緊繃。",
        solution: "順著小腿三頭肌紋理推拿放鬆，疏通比目魚肌與足底筋膜連結，恢復雙腿輕盈度。"
      }
    ];

    // 初始化快速選擇按鈕
    const quickBtnContainer = document.getElementById('quick-select-btns');
    HOTSPOTS_DATA.forEach((data, index) => {
      const btn = document.createElement('button');
      btn.className = `p-2 rounded-lg text-xs font-semibold text-center border transition-all ${index === 0 ? 'bg-amber-500/30 border-amber-400 text-amber-300' : 'bg-slate-800/80 border-slate-700 text-gray-300 hover:border-amber-400/50'}`;
      btn.innerText = data.name.split(' / ')[0];
      btn.addEventListener('click', () => {
        document.querySelectorAll('#quick-select-btns button').forEach(b => {
          b.className = 'p-2 rounded-lg text-xs font-semibold text-center border bg-slate-800/80 border-slate-700 text-gray-300 hover:border-amber-400/50';
        });
        btn.className = 'p-2 rounded-lg text-xs font-semibold text-center border bg-amber-500/30 border-amber-400 text-amber-300';
        selectHotspot(data);
      });
      quickBtnContainer.appendChild(btn);
    });

    // 2. 初始化 Three.js
    const canvas = document.getElementById('body-canvas');
    const container = document.getElementById('hotspots-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.set(0, 0.5, 6.5);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 9;
    controls.minDistance = 2.0;
    controls.target.set(0, 0, 0);

    // 3. 人體幾何體
    const bodyGroup = new THREE.Group();
    const clickableMeshes = [];

    const bodyMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x0f172a,
      emissive: 0x1e293b,
      roughness: 0.2,
      metalness: 0.8,
      transmission: 0.6,
      opacity: 0.85,
      transparent: true
    });

    const wireMaterial = new THREE.MeshBasicMaterial({
      color: 0xf59e0b,
      wireframe: true,
      transparent: true,
      opacity: 0.18
    });

    function addPart(geo, pos, rot = [0, 0, 0], dataId = null) {
      const mesh = new THREE.Mesh(geo, bodyMaterial.clone());
      const wire = new THREE.Mesh(geo, wireMaterial);
      mesh.position.set(...pos);
      mesh.rotation.set(...rot);
      wire.position.set(...pos);
      wire.rotation.set(...rot);
      if (dataId) {
        mesh.userData = { hotspotId: dataId };
        clickableMeshes.push(mesh);
      }
      bodyGroup.add(mesh);
      bodyGroup.add(wire);
      return mesh;
    }

    // 建立各部位
    addPart(new THREE.SphereGeometry(0.42, 24, 24), [0, 2.7, 0]);
    addPart(new THREE.CylinderGeometry(0.18, 0.22, 0.4, 16), [0, 2.2, 0], [0,0,0], "neck");
    addPart(new THREE.CylinderGeometry(0.75, 0.6, 1.1, 24), [0, 1.5, 0], [0,0,0], "rhomboid");
    addPart(new THREE.CylinderGeometry(0.55, 0.65, 0.7, 24), [0, 0.7, 0], [0,0,0], "lumbar");
    addPart(new THREE.CylinderGeometry(0.68, 0.55, 0.8, 24), [0, 0, 0], [0,0,0], "gluteal");

    addPart(new THREE.CylinderGeometry(0.16, 0.14, 0.9, 16), [-0.95, 1.45, 0], [0, 0, 0.2]);
    addPart(new THREE.CylinderGeometry(0.13, 0.11, 0.9, 16), [-1.2, 0.65, 0], [0, 0, 0.1]);
    addPart(new THREE.CylinderGeometry(0.16, 0.14, 0.9, 16), [0.95, 1.45, 0], [0, 0, -0.2]);
    addPart(new THREE.CylinderGeometry(0.13, 0.11, 0.9, 16), [1.2, 0.65, 0], [0, 0, -0.1]);

    addPart(new THREE.CylinderGeometry(0.24, 0.18, 1.3, 18), [-0.4, -0.9, 0], [0, 0, -0.05]);
    addPart(new THREE.CylinderGeometry(0.17, 0.12, 1.3, 18), [-0.42, -2.1, 0], [0, 0, 0], "calf");
    addPart(new THREE.CylinderGeometry(0.24, 0.18, 1.3, 18), [0.4, -0.9, 0], [0, 0, 0.05], "itband");
    addPart(new THREE.CylinderGeometry(0.17, 0.12, 1.3, 18), [0.42, -2.1, 0], [0, 0, 0]);

    scene.add(bodyGroup);

    // 燈光
    const ambLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambLight);

    const dirLightGold = new THREE.DirectionalLight(0xfbbf24, 2);
    dirLightGold.position.set(5, 5, 5);
    scene.add(dirLightGold);

    const dirLightBlue = new THREE.DirectionalLight(0x38bdf8, 1.5);
    dirLightBlue.position.set(-5, -3, -5);
    scene.add(dirLightBlue);

    // 4. 生成 3D 浮動圓點熱點
    const hotspotElements = [];
    let selectedHotspots = new Set(["肩頸 / 上斜方肌緊繃"]);
    let currentActiveData = HOTSPOTS_DATA[0];

    HOTSPOTS_DATA.forEach(data => {
      const el = document.createElement('div');
      el.className = 'hotspot-marker';
      el.innerHTML = `
        <div class="hotspot-ring"></div>
        <div class="hotspot-dot"></div>
      `;
      
      el.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        selectHotspot(data);
      });

      container.appendChild(el);
      hotspotElements.push({ element: el, data });
    });

    // 5. 3D Raycaster 射線點選支援（直接點人體模型任何部位都能選中）
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    canvas.addEventListener('pointerdown', (event) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / canvas.clientHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableMeshes);

      if (intersects.length > 0) {
        const hitId = intersects[0].object.userData.hotspotId;
        const target = HOTSPOTS_DATA.find(h => h.id === hitId);
        if (target) selectHotspot(target);
      }
    });

    // 選擇特定熱點
    function selectHotspot(data) {
      currentActiveData = data;

      document.getElementById('target-category').innerText = data.category;
      document.getElementById('target-title').innerText = data.name;
      document.getElementById('target-cause').innerText = data.cause;
      document.getElementById('target-solution').innerText = data.solution;

      gsap.to(camera.position, {
        x: data.camOffset.x,
        y: data.camOffset.y,
        z: data.camOffset.z,
        duration: 1.2,
        ease: 'power3.inOut',
        onUpdate: () => controls.update()
      });

      gsap.to(controls.target, {
        x: data.position.x,
        y: data.position.y,
        z: data.position.z,
        duration: 1.2,
        ease: 'power3.inOut'
      });
    }

    // 加入評估
    document.getElementById('add-to-assessment-btn').addEventListener('click', () => {
      if (!currentActiveData) return;
      selectedHotspots.add(currentActiveData.name);
      renderSelectedTags();
    });

    // 清空評估
    document.getElementById('clear-selected-btn').addEventListener('click', () => {
      selectedHotspots.clear();
      renderSelectedTags();
    });

    function renderSelectedTags() {
      const tagsContainer = document.getElementById('selected-tags');
      const countEl = document.getElementById('selected-count');
      countEl.innerText = selectedHotspots.size;

      if (selectedHotspots.size === 0) {
        tagsContainer.innerHTML = '<span class="text-xs text-gray-600 italic">尚未勾選任何部位</span>';
        updateLineLink();
        return;
      }

      tagsContainer.innerHTML = '';
      selectedHotspots.forEach(name => {
        const tag = document.createElement('span');
        tag.className = 'px-2 py-1 rounded-lg bg-amber-500/20 text-amber-300 text-[11px] font-semibold flex items-center gap-1 border border-amber-500/30';
        tag.innerHTML = `
          <span>${name}</span>
          <button class="hover:text-red-400 font-bold ml-1" onclick="removeTag('${name}')">×</button>
        `;
        tagsContainer.appendChild(tag);
      });

      updateLineLink();
    }

    window.removeTag = function(name) {
      selectedHotspots.delete(name);
      renderSelectedTags();
    };

    function updateLineLink() {
      const btn = document.getElementById('line-booking-btn');
      if (selectedHotspots.size > 0) {
        const listText = Array.from(selectedHotspots).join("、");
        const msg = encodeURIComponent(`您好，我想向嘉豪師傅預約評估！我在 3D 人體模型上標記了緊繃部位：【${listText}】，想了解調理方案與可預約時段。`);
        btn.href = `https://line.me/R/ti/p/@339qipqu?text=${msg}`;
      } else {
        btn.href = `https://line.me/R/ti/p/@339qipqu`;
      }
    }

    // 視角切換
    document.getElementById('view-front').addEventListener('click', () => {
      gsap.to(camera.position, { x: 0, y: 0.5, z: 6.5, duration: 1, ease: 'power2.out' });
      gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1, ease: 'power2.out' });
    });

    document.getElementById('view-back').addEventListener('click', () => {
      gsap.to(camera.position, { x: 0, y: 0.5, z: -6.5, duration: 1, ease: 'power2.out' });
      gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1, ease: 'power2.out' });
    });

    document.getElementById('view-reset').addEventListener('click', () => {
      gsap.to(camera.position, { x: 4.5, y: 2, z: 5, duration: 1.2, ease: 'power2.out' });
      gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1, ease: 'power2.out' });
    });

    // 6. 3D 熱點即時映射到螢幕 2D 像素
    function updateHotspotsPosition() {
      const halfWidth = canvas.clientWidth / 2;
      const halfHeight = canvas.clientHeight / 2;

      hotspotElements.forEach(({ element, data }) => {
        const wp = data.position.clone();
        wp.project(camera);

        if (wp.z > 1) {
          element.style.display = 'none';
          return;
        }

        element.style.display = 'flex';
        const x = (wp.x * halfWidth) + halfWidth;
        const y = -(wp.y * halfHeight) + halfHeight;
        element.style.left = `${x}px`;
        element.style.top = `${y}px`;
      });
    }

    window.addEventListener('resize', () => {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateHotspotsPosition();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
